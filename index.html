<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ARJU AVIATOR PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #00f2ff;
  --secondary: #ff00aa;
  --accent: #ffee00;
  --dark: #0a0a12;
  --glass: rgba(255, 255, 255, 0.08);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body, html {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: 'Poppins', sans-serif;
}

.game-container {
  position: absolute;
  inset: 0;
  z-index: 1;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* ===== FLOATING TOOL ===== */
.tool-box {
  position: fixed;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
  width: 260px;
  z-index: 9999;
  touch-action: none;
}

/* Unique circular card */
.main-card {
  background: linear-gradient(145deg, rgba(20,20,35,0.95), rgba(10,10,20,0.98));
  border-radius: 28px;
  padding: 18px 14px 16px;
  text-align: center;
  border: 1.5px solid transparent;
  background-clip: padding-box;
  position: relative;
  box-shadow: 
    0 0 0 1px rgba(0,242,255,0.3),
    0 15px 40px rgba(0,0,0,0.6),
    0 0 60px rgba(0,242,255,0.15);
  overflow: hidden;
}

.main-card::before {
  content: '';
  position: absolute;
  inset: -2px;
  background: linear-gradient(135deg, #00f2ff, #ff00aa, #ffee00, #00f2ff);
  background-size: 300% 300%;
  border-radius: 30px;
  z-index: -1;
  animation: borderFlow 6s linear infinite;
  opacity: 0.85;
}

@keyframes borderFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Logo circle */
.logo-circle {
  width: 82px;
  height: 82px;
  margin: -42px auto 12px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #1a1a2e, #000);
  border: 3px solid #00f2ff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 
    0 0 20px rgba(0,242,255,0.6),
    inset 0 0 15px rgba(0,242,255,0.2);
  position: relative;
  overflow: hidden;
}

.logo-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.logo-circle::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
  animation: shine 3s infinite;
}

@keyframes shine {
  0% { transform: translateX(-100%) rotate(25deg); }
  100% { transform: translateX(100%) rotate(25deg); }
}

/* Title */
.header-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 1px;
  background: linear-gradient(90deg, #00f2ff, #ff00aa, #ffee00, #00f2ff);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: textShine 4s linear infinite;
  margin-bottom: 6px;
}

@keyframes textShine {
  to { background-position: 200% center; }
}

.sub-title {
  font-size: 10px;
  color: #aaa;
  letter-spacing: 2px;
  margin-bottom: 14px;
  text-transform: uppercase;
}

/* Prediction Circle */
.prediction-circle {
  width: 140px;
  height: 140px;
  margin: 0 auto 12px;
  border-radius: 50%;
  background: radial-gradient(circle at center, #0d0d1a 0%, #050510 70%);
  border: 3px solid transparent;
  background-clip: padding-box;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 
    0 0 0 2px rgba(0,242,255,0.4),
    0 0 30px rgba(0,242,255,0.25),
    inset 0 0 20px rgba(0,0,0,0.8);
}

.prediction-circle::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, #00f2ff, #ff00aa, #ffee00, #00f2ff);
  z-index: -1;
  animation: spin 8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.prediction-display {
  font-family: 'Orbitron', sans-serif;
  font-size: 28px;
  font-weight: 900;
  color: #00ffcc;
  text-shadow: 0 0 15px rgba(0,255,204,0.7);
  line-height: 1;
}

.prediction-label {
  font-size: 9px;
  color: #888;
  letter-spacing: 1px;
  margin-top: 4px;
}

/* Timer */
.timer-box {
  background: rgba(0,0,0,0.4);
  border-radius: 12px;
  padding: 8px 12px;
  margin-bottom: 12px;
  border: 1px solid rgba(255,255,255,0.08);
}

.timer-label {
  font-size: 9px;
  color: #aaa;
  letter-spacing: 1px;
}

.timer-value {
  font-family: 'Orbitron', sans-serif;
  font-size: 18px;
  font-weight: 700;
  color: #ffee00;
  text-shadow: 0 0 10px rgba(255,238,0,0.5);
}

/* Buttons */
.btn-group {
  display: flex;
  gap: 8px;
  justify-content: center;
}

.btn {
  flex: 1;
  padding: 9px 0;
  border-radius: 12px;
  border: none;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.25s ease;
  font-family: 'Poppins', sans-serif;
}

.hide-btn {
  background: rgba(255,255,255,0.1);
  color: #ddd;
  border: 1px solid rgba(255,255,255,0.15);
}

.hide-btn:active {
  background: rgba(255,255,255,0.2);
}

.exit-btn {
  background: linear-gradient(135deg, #ff0066, #ff3399);
  color: white;
  box-shadow: 0 4px 15px rgba(255,0,102,0.4);
}

.exit-btn:active {
  transform: scale(0.97);
}

/* Login Section */
#login-section {
  padding-top: 20px;
}

.input-field {
  width: 100%;
  padding: 11px;
  border-radius: 12px;
  border: 1.5px solid rgba(0,242,255,0.4);
  background: rgba(0,0,0,0.5);
  color: #fff;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 12px;
  outline: none;
  letter-spacing: 2px;
}

.input-field:focus {
  border-color: #00f2ff;
  box-shadow: 0 0 15px rgba(0,242,255,0.3);
}

.login-btn {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #00f2ff, #0088ff);
  color: #000;
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 5px 20px rgba(0,242,255,0.4);
}

.login-btn:active {
  transform: scale(0.98);
}

.notice-text {
  margin-top: 12px;
  font-size: 10px;
  color: #00f2ff;
  letter-spacing: 1px;
  opacity: 0.8;
}

/* Mini icon */
#mini-icon {
  position: fixed;
  top: 140px;
  left: 0;
  width: 48px;
  height: 48px;
  background: linear-gradient(135deg, #00f2ff, #ff00aa);
  border-radius: 0 50% 50% 0;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  box-shadow: 0 0 20px rgba(0,242,255,0.5);
  font-size: 22px;
  cursor: pointer;
}

/* Popup notice */
.popup-notice {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: linear-gradient(145deg, #111122, #0a0a18);
  border: 1.5px solid #00f2ff;
  padding: 22px 18px;
  border-radius: 18px;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  color: #eee;
  z-index: 10000;
  display: none;
  box-shadow: 0 0 40px rgba(0,242,255,0.3);
  max-width: 280px;
  line-height: 1.5;
}

.popup-notice span {
  color: #00f2ff;
  display: block;
  margin-bottom: 6px;
}
</style>
</head>

<body>

</div>
